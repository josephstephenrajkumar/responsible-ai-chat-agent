version: '3.8'
services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ':9411'
    ports:
      - '16686:16686'
      - '6831:6831/udp'
      - '14268:14268'

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    environment:
      DATABASE_URL: sqlite:////app/backend/app/storage/responsible_ai.db
      JAEGER_HOST: jaeger
      JAEGER_PORT: 6831
      JAEGER_UI_URL: http://localhost:16686
    command: bash -lc "pip install -r requirements.txt && python -m spacy download en_core_web_lg && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - '8000:8000'
    depends_on:
      - jaeger

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - '5173:5173'
